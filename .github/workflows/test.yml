name: Test
on:
  push: { branches: [ "main" ] }
  pull_request: { branches: [ "main" ] }
  schedule:
    - cron: '23 5 1-7 * 3'
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ["ubuntu-latest", "macos-latest"]
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: setup conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: test
          environment-file: environment.yml
      - name: list packages
        shell: bash -l {0}
        run: conda list
      - name: install package
        shell: bash -l {0}
        run: |
          pip install --no-build-isolation --no-dependencies .
      - name: doctest
        shell: bash -l {0}
        # The sage launcher of recent versions has no -t option. Test the
        # installed package (with its compiled extensions), from outside the
        # checkout so that the sources are not imported instead.
        run: |
          cd "$RUNNER_TEMP"
          python -m sage.doctest "$(python -c 'import darmonpoints, os; print(os.path.dirname(darmonpoints.__file__))')"
